# Access level: FAST automation service accounts
#
# Compliance:
#   CIS Benchmarks: CIS GCP 1.x IAM — service accounts use principle of least privilege
#   SOC 2: CC6.1 System access controls — logical access restricted to authorized service accounts
#   HIPAA: §164.312(a)(1) Access control — unique user (service account) identification
#
# CRITICAL: Without this, terraform plan/apply fails for perimeter resources.

description: FAST automation service accounts for Terraform CI/CD.
conditions:
- members:
  - $iam_principals:service_accounts/iac-0/iac-org-rw
  - $iam_principals:service_accounts/iac-0/iac-vpcsc-rw
  - $iam_principals:service_accounts/iac-0/iac-networking-rw
  - $iam_principals:service_accounts/iac-0/iac-security-rw
  - $iam_principals:service_accounts/iac-0/iac-pf-rw
  - $iam_principals:service_accounts/iac-0/terraform-org-sa
  - $iam_principals:service_accounts/iac-0/cicd-deploy-sa
