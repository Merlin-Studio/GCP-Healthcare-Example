# Main VPC-SC perimeter protecting all sensitive workload projects
#
# Compliance:
#   CIS Benchmarks: CIS GCP 3.x VPC controls — configure VPC Service Controls for data exfiltration prevention
#   SOC 2: CC6.1 Logical access security — restrict access to information assets
#   HIPAA: §164.312(e)(1) Transmission security — guard against unauthorized access to ePHI in transit
#
# DESIGN: Single perimeter in dry-run mode. All projects included.
# Restricted services derived from project factory API enablement.
#
# HIPAA NOTE: This perimeter protects access to ePHI. All projects that
# store, process, or transmit electronic Protected Health Information must
# be inside this perimeter (§164.312(e)(1) Transmission Security).
#
# ARCHITECT TODO:
# - [ ] Review restricted_services list against actual API usage
# - [ ] Verify all environment project IDs are included below
# - [ ] Monitor dry-run logs 2-4 weeks before enforcing
# - [ ] To enforce: move 'spec' contents to 'status', remove use_explicit_dry_run_spec
# - [ ] HIPAA: Verify all ePHI-processing projects are inside this perimeter

description: Primary service perimeter protecting workload and data projects. Started in dry-run mode for safe validation.
use_explicit_dry_run_spec: true
spec:
  access_levels:
  - corp-network
  - fast-automation
  - admin-identity
  resources:
  - $project_ids:healthcar-sec-core-0
  - $project_ids:healthcar-net-core-0
  - $project_ids:healthcar-gke-dev-0
  - $project_ids:healthcar-gke-stg-0
  - $project_ids:healthcar-gke-prd-0
  - $project_ids:healthcar-dp-dev-0
  - $project_ids:healthcar-dp-stg-0
  - $project_ids:healthcar-dp-prd-0
  - $project_ids:healthcar-app-dev-0
  - $project_ids:healthcar-app-stg-0
  - $project_ids:healthcar-app-prd-0
  - $project_ids:healthcar-ops-dev-0
  - $project_ids:healthcar-ops-stg-0
  - $project_ids:healthcar-ops-prd-0
  restricted_services:
  - artifactregistry.googleapis.com
  - bigquery.googleapis.com
  - binaryauthorization.googleapis.com
  - cloudbuild.googleapis.com
  - cloudfunctions.googleapis.com
  - cloudkms.googleapis.com
  - cloudresourcemanager.googleapis.com
  - cloudtrace.googleapis.com
  - compute.googleapis.com
  - container.googleapis.com
  - containeranalysis.googleapis.com
  - iam.googleapis.com
  - iamcredentials.googleapis.com
  - logging.googleapis.com
  - monitoring.googleapis.com
  - pubsub.googleapis.com
  - run.googleapis.com
  - secretmanager.googleapis.com
  - sqladmin.googleapis.com
  - storage.googleapis.com
  - sts.googleapis.com
  ingress_policies:
  - fast-automation-ingress
  - admin-console-ingress
  - gke-control-plane-ingress
  egress_policies:
  - gcr-artifact-egress
  - logging-egress
  vpc_accessible_services:
    allowed_services:
    - RESTRICTED-SERVICES
    enable_restriction: true
